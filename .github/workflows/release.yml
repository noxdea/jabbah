name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish gem
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Required to create the GitHub release.
      id-token: write # Required for RubyGems trusted publishing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: '3.4'
      - name: Verify tag and version
        run: test "$GITHUB_REF_NAME" = "v$(ruby -Ilib -rjabbah/version -e 'print Jabbah::VERSION')"
      - run: bundle install
      - run: bundle exec rake test
      - run: bundle exec rbs -I sig validate
      - run: gem build --strict jabbah.gemspec --output /tmp/jabbah.gem
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish through RubyGems trusted publishing
        run: gem push /tmp/jabbah.gem
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
